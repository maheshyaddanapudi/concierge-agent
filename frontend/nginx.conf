# The shipped edge: plain HTTP/1.1 on :8080, SPA + API proxy. Browsers cap
# HTTP/1.1 at six connections per host, and every open chat stream, the
# ambient stream and the polling share that budget — three or four tabs
# with live runs is where a fresh install runs out. HTTP/2 multiplexes
# them over one connection, but browsers only speak h2 over TLS, so it is
# a property of the TLS edge (this container behind a TLS terminator, or
# the commented server block below with your certificate). Both blocks
# keep the SSE settings: no buffering, long read timeout, connection
# header cleared for the upstream (M53).
#
# The listener is 8080, not 80: the image runs nginx as the unprivileged
# `nginx` account (frontend/Dockerfile) and a non-root process cannot bind a
# port below 1024. Nothing changes for a caller — docker-compose.yml publishes
# ${FRONTEND_PORT:-5173} onto 8080, so the browser URL is what it always was.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # M54: resolve `backend` through Docker's embedded DNS on every request
    # (a variable in proxy_pass defeats nginx's start-time resolution), so
    # `--scale backend=N` replicas join and leave without a restart and
    # requests round-robin across whatever is up
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend_upstream http://backend:8000;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        # SSE: no buffering, long-lived connections
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        # The caller's real address. Without these every browser arrived as
        # the proxy's container IP, so the backend's inbound rate limiter —
        # which keys on `request.client.host` — put ALL traffic in ONE
        # bucket: one user's burst throttled everybody, and a per-attacker
        # limit was really a per-deployment limit. uvicorn must be started
        # with --proxy-headers (see backend/Dockerfile) for these to be
        # honoured; without that flag they are inert.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /metrics {
        # one replica's metrics per request — scrape replicas individually
        # (docs/observability/prometheus.yml uses DNS discovery for that)
        proxy_pass $backend_upstream;
    }

    location / {
        try_files $uri /index.html;
    }
}

